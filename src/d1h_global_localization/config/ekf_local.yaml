ekf_local:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.25
    # Ground navigation: constrain z, roll and pitch to the map plane.
    two_d_mode: true
    transform_time_offset: 0.0
    transform_timeout: 0.0
    predict_to_current_time: true
    print_diagnostics: true
    debug: false
    publish_tf: true
    publish_acceleration: false
    reset_on_time_jump: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    # Simulation source only. In deployment remap this to /odometry/livo.
    odom0: /odometry/gazebo
    odom0_queue_size: 10
    odom0_differential: false
    odom0_relative: false
    odom0_config: [true, true, true,
                   false, false, true,
                   true, true, true,
                   false, false, true,
                   false, false, false]

    imu0: /imu/data
    imu0_queue_size: 50
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: true
    imu0_config: [false, false, false,
                  false, false, true,
                  false, false, false,
                  false, false, true,
                  false, false, false]

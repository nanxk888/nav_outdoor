ekf_global:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.25
    # Keep map -> odom planar for a wheeled ground robot.
    two_d_mode: true
    transform_time_offset: 0.0
    transform_timeout: 0.0
    predict_to_current_time: true
    print_diagnostics: true
    debug: false
    publish_tf: true
    reset_on_time_jump: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: map

    # Local LIO/odometry provides continuity; GPS-derived odometry anchors map.
    odom0: /odometry/local
    odom0_queue_size: 10
    odom0_differential: false
    odom0_relative: false
    odom0_config: [true, true, true,
                   true, true, true,
                   true, true, true,
                   true, true, true,
                   false, false, false]

    odom1: /odometry/gps
    odom1_queue_size: 10
    odom1_differential: false
    odom1_relative: false
    odom1_config: [true, true, true,
                   false, false, false,
                   false, false, false,
                   false, false, false,
                   false, false, false]

    imu0: /imu/data
    imu0_queue_size: 50
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: true
    imu0_config: [false, false, false,
                  false, false, true,
                  false, false, false,
                  false, false, true,
                  false, false, false]
